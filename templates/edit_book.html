
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Book</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eaf6ff, #8ec5fc, #dff3ff);
            padding: 40px 20px;
        }

        .edit-book-container {
            max-width: 650px;
            margin: 0 auto;
            padding: 30px;
            background: rgba(255, 255, 255, 0.94);
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 50, 100, 0.18);
        }

        h1 {
            text-align: center;
            color: #174a85;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            color: #173b68;
            font-weight: bold;
        }

        input[type="text"],
        input[type="number"],
        input[type="file"],
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #b8d4ed;
            border-radius: 8px;
            background: white;
            font-size: 15px;
        }

        button {
            margin-top: 24px;
            padding: 12px 22px;
            border: none;
            border-radius: 8px;
            background: #24569b;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #173e75;
        }

        .cancel-link {
            display: inline-block;
            margin-left: 15px;
            color: #174a85;
        }
    </style>
</head>

<body>
    <main class="edit-book-container">
        <h1>Edit Book</h1>

        <form method="POST" enctype="multipart/form-data">
            <label for="title">Book Title:</label>
            <input
                type="text"
                id="title"
                name="title"
                value="{{ book.title }}"
                required
            >

            <label for="price">Price:</label>
            <input
                type="number"
                id="price"
                name="price"
                value="{{ book.price }}"
                min="0"
                step="0.01"
                required
            >

            <label for="author_id">Author:</label>
            <select id="author_id" name="author_id" required>
                {% for author in authors %}
                <option value="{{ author.author_id }}"
                    {% if author.author_id == book.author_id %}selected{% endif %}>
                    {{ author.name }}
                </option>
                {% endfor %}
            </select>

            <label for="cover">Book Cover:</label>
            <input type="file" id="cover" name="cover" accept="image/*">

            <button type="submit">Save Changes</button>
            <a class="cancel-link" href="{{ url_for('library') }}">Cancel</a>
        </form>
    </main>
</body>
</html>
