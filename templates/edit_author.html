
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Author</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <main class="edit-author-container">
        <section class="library-section">
            <h1>Edit Author</h1>

            <form method="POST" enctype="multipart/form-data">

                <label for="name">Author Name:</label>
                <input type="text" id="name" name="name"
                       value="{{ author.name }}" required>

                <br><br>

                <label for="country">Country:</label>
                <input type="text" id="country" name="country"
                       value="{{ author.country }}" required>

                <br><br>

                <label>Current Author Photo:</label>
                {% if author.photo %}
                    <br>
                    <img src="{{ url_for('static', filename='uploads/' + author.photo) }}"
                         alt="Author Photo" width="120">
                    <br>
                {% else %}
                    <p>No photo uploaded.</p>
                {% endif %}

                <label for="photo">Choose New Author Photo:</label>
                <input type="file" id="photo" name="photo"
                       accept="image/*">

                <br><br>

                <button type="submit">Save Changes</button>
                <a href="{{ url_for('library') }}">Cancel</a>

            </form>
        </section>
    </main>

</body>
</html>
